<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoCare – Szervizkezelő</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e8eef6;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:#101c2e;padding:25px 17px;border-right:1px solid #27344a}.brand{font-size:25px;font-weight:800;color:#fff;margin-bottom:35px}.brand span{color:#39b6ff}.nav{display:block;width:100%;padding:13px 15px;margin:6px 0;text-align:left;color:#bdcadb;background:none;border:0;border-radius:10px}.nav.active,.nav:hover{background:#203650;color:#fff}.side-bottom{margin-top:45px;color:#91a4b9;font-size:13px}.content{flex:1;min-width:0;padding:30px 38px;max-width:1450px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.top h1{margin:0;font-size:29px}.muted{color:#9badc2;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.panel,.stat{background:#142238;border:1px solid #2b3c53;border-radius:16px;padding:22px;margin-bottom:18px}.stat strong{display:block;font-size:30px;margin-top:8px;color:#fff}.panel h2{margin:0 0 18px;font-size:19px}.item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid #2b3c53}.item:last-child{border:0}.item b{font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{background:#243a55;border:1px solid #37516d;color:#f2f6ff;padding:10px 14px;border-radius:9px}.btn:hover{filter:brightness(1.15)}.primary{background:#1686e3;border-color:#1686e3}.danger{background:#632d3a;border-color:#9b4353}.success{background:#1b624f;border-color:#25846c}.tag{display:inline-block;padding:6px 10px;border-radius:30px;background:#2d425b;color:#e5f1ff;font-size:12px;white-space:nowrap}.tag.wait{background:#655026}.tag.done{background:#175a47}.tag.alert{background:#733742}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#c9d8ea}.field input,.field select,.field textarea{width:100%;border:1px solid #3c5068;border-radius:9px;padding:11px;background:#0c182a;color:#fff;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#42adf9}.wide{grid-column:1/-1}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card{width:min(440px,100%);background:#142238;border:1px solid #2b3c53;border-radius:18px;padding:32px}.auth-card h1{margin:0 0 7px}.auth-card .field{margin:14px 0}.auth-tabs{display:flex;gap:8px;margin:20px 0}.auth-tabs button{flex:1}.notice{background:#15394d;border:1px solid #27708b;padding:14px;border-radius:10px;margin:15px 0;color:#d9f6ff}.empty{padding:22px;color:#9badc2;text-align:center}.small{font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:13px;text-align:left;border-bottom:1px solid #2b3c53;font-size:13px}th{color:#aebed1}.toast{position:fixed;right:24px;bottom:24px;background:#1c6a58;color:white;padding:14px 20px;border-radius:10px;box-shadow:0 10px 30px #0008;z-index:10}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.detail-box{background:#0c182a;border:1px solid #2b3c53;border-radius:12px;padding:16px}.detail-box .muted{margin-bottom:6px}.detail-box strong{display:block;overflow-wrap:anywhere}.ticket-search{width:min(350px,100%);padding:11px;background:#0c182a;color:#fff;border:1px solid #3c5068;border-radius:9px}.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.link{background:none;border:0;color:#71c3ff;text-decoration:underline;padding:5px}.hint{font-size:12px;color:#9badc2;margin-top:6px}@media(max-width:900px){.sidebar{width:190px}.content{padding:24px}.grid{grid-template-columns:1fr}}@media(max-width:650px){.detail-grid{grid-template-columns:1fr}.app{display:block}.sidebar{width:auto;border-right:0;border-bottom:1px solid #27344a;padding:15px}.brand{margin:0 0 10px}.sidebar nav{display:flex;overflow:auto;gap:6px}.nav{width:auto;white-space:nowrap}.side-bottom{margin-top:10px}.content{padding:18px}.form-grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.top h1{font-size:23px}}

/* AutoCare V5 – ügyféloldali kiegészítések */
.filter-row{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}.filter-row .btn.selected{background:#1686e3;border-color:#1686e3}.car-preview{padding:12px 15px;border:1px solid #294763;background:#0c1d30;border-radius:10px;color:#b7dcfa;font-size:13px}.calendar-shell{position:relative}.calendar-trigger{width:100%;text-align:left;padding:12px;border-radius:9px;border:1px solid #3c5068;background:#0c182a;color:#fff}.calendar-pop{position:absolute;z-index:6;top:calc(100% + 7px);left:0;width:min(340px,100%);padding:16px;background:#192b43;border:1px solid #45617e;box-shadow:0 14px 35px #0009;border-radius:14px}.calendar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.calendar-top select{width:auto;min-width:140px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-grid span{text-align:center;color:#9badc2;font-size:11px;padding:8px 0}.calendar-day{padding:8px 0;border:0;border-radius:8px;background:#253b55;color:white}.calendar-day:hover,.calendar-day.chosen{background:#1686e3}.calendar-day:disabled{background:#172338;color:#5f7189}.form-section-title{grid-column:1/-1;margin:8px 0 0;color:#e9f4ff;font-weight:700;font-size:15px}.car-item-details{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.car-item-details span{font-size:12px;background:#213a55;border-radius:30px;padding:4px 9px;color:#c7d9ea}
</style>
</head>
<body><div id="app"></div>
<script>
'use strict';
const KEY='autocare_v3';
const catalog={
 'Német':{'Volkswagen':['Passat','Polo','Golf','Tiguan','Touran','Arteon','Touareg'],'Audi':['A3','A4','A5','A6','Q3','Q5','Q7'],'BMW':['1-es sorozat','3-as sorozat','5-ös sorozat','X1','X3','X5','X6'],'Mercedes-Benz':['A-osztály','C-osztály','E-osztály','S-osztály','GLA','GLC','GLE'],'Opel':['Astra','Corsa','Insignia','Mokka','Crossland','Grandland','Zafira'],'Porsche':['911','Cayenne','Macan','Panamera','Taycan','Boxster','Cayman']},
 'Japán':{'Toyota':['Corolla','Yaris','RAV4','Camry','Prius','C-HR','Land Cruiser'],'Honda':['Civic','Accord','Jazz','CR-V','HR-V','Prelude','e:Ny1'],'Nissan':['Micra','Juke','Qashqai','X-Trail','Leaf','Navara','Note'],'Mazda':['Mazda2','Mazda3','Mazda6','CX-3','CX-5','CX-30','MX-5'],'Suzuki':['Swift','Vitara','S-Cross','Ignis','Jimny','Baleno','Across'],'Subaru':['Impreza','Legacy','Forester','Outback','XV','BRZ','Crosstrek']},
 'Amerikai':{'Ford':['Focus','Fiesta','Mondeo','Kuga','Puma','Mustang','Explorer'],'Chevrolet':['Cruze','Camaro','Corvette','Malibu','Tahoe','Spark','Captiva'],'Jeep':['Renegade','Compass','Cherokee','Grand Cherokee','Wrangler','Avenger','Gladiator']},
 'Francia':{'Renault':['Clio','Megane','Captur','Kadjar','Scenic','Austral','Arkana'],'Peugeot':['208','308','408','2008','3008','5008','508'],'Citroën':['C3','C4','C5 Aircross','Berlingo','C1','C3 Aircross','C5 X']},
 'Olasz':{'Fiat':['500','Panda','Tipo','Punto','Bravo','Doblo','500X'],'Alfa Romeo':['Giulia','Giulietta','Stelvio','Tonale','MiTo','159','Brera']},
 'Koreai':{'Hyundai':['i10','i20','i30','Tucson','Kona','Santa Fe','IONIQ 5'],'Kia':['Ceed','Rio','Sportage','Sorento','Stonic','Niro','Picanto']},
 'Brit':{'Mini':['Cooper','Countryman','Clubman','Paceman','Roadster','Convertible','Aceman'],'Land Rover':['Defender','Discovery','Discovery Sport','Range Rover','Evoque','Velar','Freelander'],'Jaguar':['XE','XF','XJ','F-Pace','E-Pace','I-Pace','F-Type']},
 'Svéd':{'Volvo':['S60','S90','V40','V60','V90','XC40','XC60'],'Saab':['9-3','9-5','900','9000','9-7X','9-4X','99']},
 'Cseh':{'Škoda':['Octavia','Fabia','Superb','Kodiaq','Karoq','Scala','Kamiq']}
};
const services={'Rutinvizsgálat':60,'Olajcsere':45,'Nagyszerviz':180,'Sürgős szerviz':120};
const initial={users:[{email:'ugyfel@auto.hu',password:'ugyfel',name:'Teszt Ügyfél',role:'customer'},{email:'admin',password:'admin',name:'Autószerelő',role:'mechanic'}],cars:[{id:1,owner:'ugyfel@auto.hu',origin:'Német',brand:'Volkswagen',model:'Passat',year:2018}],bookings:[{id:1001,owner:'ugyfel@auto.hu',carId:1,car:'Volkswagen Passat (2018)',origin:'Német',type:'Olajcsere',date:'2026-10-29',time:'09:00',duration:45,description:'Olaj és szűrők cseréje',status:'Függőben',mechanic:null}],stock:[{id:1,name:'Motorolaj 5W-30',qty:18,unit:'liter'},{id:2,name:'Olajszűrő',qty:9,unit:'db'},{id:3,name:'Levegőszűrő',qty:7,unit:'db'},{id:4,name:'Fékbetét készlet',qty:4,unit:'db'},{id:5,name:'Gyújtógyertya',qty:12,unit:'db'}]};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.users)&&Array.isArray(d.bookings))return d}catch(e){}return structuredClone(initial)}
let db=load(),session=null,page='overview',authMode='login',authRole='customer',selectedTicket=null,ticketSearch='';
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
function badge(status){let cls=['Resolved','Befejezve'].includes(status)?'done':['Alkatrészre vár','Lezárásra vár','Függőben'].includes(status)?'wait':['Reklamáció','Lemondva'].includes(status)?'alert':'';return `<span class="tag ${cls}">${esc(status)}</span>`}
function carName(c){return `${c.brand} ${c.model} (${c.year})`}
function opts(values,placeholder='Válassz...'){return `<option value="">${placeholder}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
const brandIndex=Object.entries(catalog).flatMap(([origin,brands])=>Object.entries(brands).map(([brand,models])=>({origin,brand,models})));
const fuels=['Benzin','Dízel','Hibrid','Plug-in hibrid','Elektromos','LPG / CNG'];
const engines=['1.0 TSI','1.2 TSI','1.4 TSI','1.5 TSI','1.6 MPI','1.6 TDI','2.0 TDI','2.0 TSI','2.0 HDi','1.5 dCi','1.8 Hybrid','2.0 Hybrid','3.0 TDI','3.0d','Elektromos'];
function carFields(prefix){return `<div class="field"><label>Autómárka *</label><input id="${prefix}-brand" list="${prefix}-brands" autocomplete="off" placeholder="Kezdd el írni: Volkswagen, Audi..." oninput="updateModels('${prefix}')" required><datalist id="${prefix}-brands">${brandIndex.map(x=>`<option value="${esc(x.brand)}"></option>`).join('')}</datalist></div><div class="field"><label>Származási ország (automatikus)</label><input id="${prefix}-origin" readonly placeholder="A márka alapján kitöltjük"></div><div class="field"><label>Típus *</label><select id="${prefix}-model" required>${opts([],'Először válassz márkát')}</select></div><div class="field"><label>Évjárat *</label><select id="${prefix}-year" required>${opts(Array.from({length:17},(_,i)=>2026-i),'Válassz évjáratot')}</select></div><div class="field"><label>Üzemanyag *</label><select id="${prefix}-fuel" required>${opts(fuels,'Válassz üzemanyagot')}</select></div><div class="field"><label>Motortípus (opcionális)</label><input id="${prefix}-engine" list="${prefix}-engines" placeholder="Pl. 2.0 TDI, 1.4 TSI"><datalist id="${prefix}-engines">${engines.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></div>`}
function updateModels(prefix){let brand=document.getElementById(prefix+'-brand').value.trim();let entry=brandIndex.find(x=>x.brand.toLocaleLowerCase('hu-HU')===brand.toLocaleLowerCase('hu-HU'));document.getElementById(prefix+'-origin').value=entry?.origin||'';document.getElementById(prefix+'-model').innerHTML=opts(entry?.models||[],entry?'Válassz típust':'Először válassz érvényes márkát')}
function fieldValue(prefix){return {origin:document.getElementById(prefix+'-origin').value,brand:document.getElementById(prefix+'-brand').value.trim(),model:document.getElementById(prefix+'-model').value,year:Number(document.getElementById(prefix+'-year').value),fuel:document.getElementById(prefix+'-fuel').value,engine:document.getElementById(prefix+'-engine').value.trim()}}
function populateCar(prefix,c){document.getElementById(prefix+'-brand').value=c.brand;updateModels(prefix);document.getElementById(prefix+'-model').value=c.model;document.getElementById(prefix+'-year').value=c.year;document.getElementById(prefix+'-fuel').value=c.fuel||'';document.getElementById(prefix+'-engine').value=c.engine||''}
let bookingFilter='all',calendarMonth=9,calendarOpen=false;
const monthNames=['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
function calendarWidget(){return `<div class="field"><label>Foglalás dátuma (2026) *</label><div class="calendar-shell"><button type="button" class="calendar-trigger" onclick="calendarOpen=!calendarOpen;drawCalendar()" id="calendar-trigger">Válassz napot a naptárból ▾</button><div id="calendar-pop" class="calendar-pop" style="display:none"></div></div><input id="date" type="hidden" required></div>`}
function drawCalendar(){let pop=document.getElementById('calendar-pop');if(!pop)return;pop.style.display=calendarOpen?'block':'none';if(!calendarOpen)return;let today=new Date(),days=new Date(2026,calendarMonth+1,0).getDate(),offset=(new Date(2026,calendarMonth,1).getDay()+6)%7,selected=document.getElementById('date').value;pop.innerHTML=`<div class="calendar-top"><button type="button" class="btn" onclick="moveMonth(-1)" ${calendarMonth===0?'disabled':''}>‹</button><strong>2026. ${monthNames[calendarMonth]}</strong><button type="button" class="btn" onclick="moveMonth(1)" ${calendarMonth===11?'disabled':''}>›</button></div><div class="calendar-grid">${['H','K','Sze','Cs','P','Szo','V'].map(x=>`<span>${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let day=i+1,iso=`2026-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,past=new Date(2026,calendarMonth,day+1)<=today;return `<button type="button" class="calendar-day ${iso===selected?'chosen':''}" ${past?'disabled':''} onclick="chooseDay('${iso}')">${day}</button>`}).join('')}</div>`}
function moveMonth(n){calendarMonth=Math.max(0,Math.min(11,calendarMonth+n));drawCalendar()}
function chooseDay(iso){document.getElementById('date').value=iso;document.getElementById('calendar-trigger').textContent=new Date(iso+'T12:00:00').toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'})+' ▾';calendarOpen=false;drawCalendar()}
function login(e){e.preventDefault();let email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;let u=db.users.find(u=>u.email===email&&u.password===pass&&u.role===authRole);if(!u)return toast('Hibás bejelentkezési adatok!');session={email:u.email,name:u.name,role:u.role};page='overview';render()}
function register(e){e.preventDefault();let name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;if(db.users.some(u=>u.email===email))return toast('Ez az e-mail már foglalt.');if(pass.length<4)return toast('A jelszó legalább 4 karakter legyen.');db.users.push({name,email,password:pass,role:'customer'});persist();session={name,email,role:'customer'};page='overview';render()}
function logout(){session=null;authMode='login';authRole='customer';render()}
function authView(){return `<div class="auth-wrap"><div class="auth-card"><div class="brand">Auto<span>Care</span></div><h1>${authMode==='register'?'Regisztráció':'Bejelentkezés'}</h1><p class="muted">Autószerviz időpontfoglaló és munkakezelő rendszer</p><div class="auth-tabs"><button class="btn ${authRole==='customer'?'primary':''}" onclick="authRole='customer';authMode='login';render()">Ügyfél</button><button class="btn ${authRole==='mechanic'?'primary':''}" onclick="authRole='mechanic';authMode='login';render()">Autószerelő / Admin</button></div><form onsubmit="${authMode==='register'?'register(event)':'login(event)'}">${authMode==='register'?'<div class="field"><label>Teljes név</label><input id="name" required></div>':''}<div class="field"><label>${authRole==='mechanic'?'Felhasználónév':'E-mail cím'}</label><input id="email" ${authRole==='customer'?'type="email"':''} required placeholder="${authRole==='mechanic'?'admin':'ugyfel@auto.hu'}"></div><div class="field"><label>Jelszó</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%;margin-top:12px">${authMode==='register'?'Regisztráció':'Bejelentkezés'}</button></form>${authRole==='customer'?`<p class="muted">${authMode==='login'?'Nincs még fiókod?':'Már van fiókod?'} <button class="link" onclick="authMode='${authMode==='login'?'register':'login'}';render()">${authMode==='login'?'Regisztráció':'Bejelentkezés'}</button></p>`:''}<div class="hint">Tesztadatok: ${authRole==='mechanic'?'admin / admin':'ugyfel@auto.hu / ugyfel'}</div></div></div>`}
const menuCustomer=[['overview','Áttekintés'],['booking','Új időpont'],['bookings','Foglalásaim'],['cars','Autóim']];
const menuMechanic=[['overview','Dashboard'],['incoming','Beérkező ticketek'],['active','Aktív munkák'],['waiting','Visszaigazolásra vár'],['resolved','Resolved ticketek'],['calendar','Időpontok'],['stock','Alkatrészkészlet']];
function layout(){let menus=session.role==='customer'?menuCustomer:menuMechanic;return `<div class="app"><aside class="sidebar"><div class="brand">Auto<span>Care</span></div><nav>${menus.map(([id,label])=>`<button class="nav ${page===id?'active':''}" onclick="page='${id}';render()">${label}</button>`).join('')}</nav><div class="side-bottom">${esc(session.name)}<br>${session.role==='mechanic'?'Autószerelő':'Ügyfél'}<br><button class="btn" style="margin-top:12px" onclick="logout()">Kijelentkezés</button></div></aside><main class="content">${session.role==='customer'?customerView():mechanicView()}</main></div>`}
function header(title,desc){return `<div class="top"><div><h1>${title}</h1><div class="muted">${desc}</div></div></div>`}
function customerBookings(){return db.bookings.filter(b=>b.owner===session.email)}
function customerView(){let mine=customerBookings();if(page==='overview')return header('Üdvözlünk, '+esc(session.name)+'!','Itt követheted a szervizügyeidet.')+`<div class="grid"><div class="stat">Autóim<strong>${db.cars.filter(c=>c.owner===session.email).length}</strong></div><div class="stat">Aktív foglalások<strong>${mine.filter(b=>!['Resolved','Lemondva'].includes(b.status)).length}</strong></div><div class="stat">Lezárt munkák<strong>${mine.filter(b=>b.status==='Resolved').length}</strong></div></div><section class="panel"><div class="toolbar"><h2>Legutóbbi foglalások</h2><button class="btn primary" onclick="page='booking';render()">+ Új időpont</button></div>${bookingItems(mine.slice(-5).reverse())}</section>`;
if(page==='cars')return header('Autóim','Járműveid hozzáadása és kezelése')+`<section class="panel"><h2>Új autó hozzáadása</h2><p class="muted">Kezdd el begépelni a márkát, és válassz a találatokból. A származást automatikusan kitöltjük.</p><form class="form-grid" onsubmit="addCar(event)">${carFields('car')}<div class="wide"><button class="btn primary">Autó hozzáadása</button></div></form></section><section class="panel"><h2>Mentett autók</h2>${db.cars.filter(c=>c.owner===session.email).map(c=>`<div class="item"><div><b>${esc(carName(c))}</b><div class="car-item-details"><span>${esc(c.origin)}</span><span>${esc(c.fuel||'Üzemanyag nincs megadva')}</span>${c.engine?`<span>${esc(c.engine)}</span>`:''}</div></div><button class="btn danger" onclick="removeCar(${c.id})">Eltávolítás</button></div>`).join('')||'<p class="empty">Még nincs autód.</p>'}</section>`;
if(page==='booking'){let cars=db.cars.filter(c=>c.owner===session.email);return header('Új időpont','Szervizidőpont kérése 2026-ra')+`<section class="panel"><form class="form-grid" onsubmit="addBooking(event)"><div class="form-section-title">1. Jármű adatai</div><div class="field wide"><label>Mentett autó használata (opcionális)</label><select id="saved-car" onchange="fillSavedCar()">${opts(cars.map(c=>c.id+' | '+carName(c)),'Új autó megadása')}</select></div>${carFields('booking')}<div class="form-section-title">2. Szervizigény</div><div class="field"><label>Szolgáltatás *</label><select id="service" required onchange="updateDuration()">${opts(Object.keys(services))}</select><span class="hint" id="duration-hint">Válassz szolgáltatást</span></div><div class="field wide"><label>Hibaleírás / megjegyzés</label><textarea id="description" placeholder="Írd le a problémát..."></textarea></div><div class="form-section-title">3. Időpont kiválasztása</div>${calendarWidget()}<div class="field"><label>Kezdési időpont *</label><select id="time" required>${opts(Array.from({length:18},(_,i)=>`${String(8+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`),'Válassz időpontot')}</select></div><div class="wide"><button class="btn primary">Időpontkérés elküldése</button></div></form><p class="hint">A foglalás függő státuszba kerül a szerelő elfogadásáig. Az időpontok jelenleg demóértékek; a szabad kapacitást később a backend ellenőrzi.</p></section>`}
if(page==='bookings'){let filtered=mine.filter(b=>bookingFilter==='all'||(bookingFilter==='active'?!['Resolved','Lemondva'].includes(b.status):['Resolved','Lemondva'].includes(b.status)));return header('Foglalásaim','Szervizügyeid és azok aktuális állapota')+`<section class="panel"><div class="filter-row">${[['all','Összes'],['active','Folyamatban lévő'],['closed','Lezárt']].map(([id,label])=>`<button class="btn ${bookingFilter===id?'selected':''}" onclick="bookingFilter='${id}';render()">${label} (${id==='all'?mine.length:id==='active'?mine.filter(b=>!['Resolved','Lemondva'].includes(b.status)).length:mine.filter(b=>['Resolved','Lemondva'].includes(b.status)).length})</button>`).join('')}</div>${bookingItems(filtered.slice().reverse())}</section>`}return ''}
function bookingItems(data){if(!data.length)return '<p class="empty">Nincs foglalás.</p>';return data.map(b=>`<div class="item"><div><b>#${b.id} · ${esc(b.car)}</b><div class="muted">${esc(b.type)} · ${esc(b.date)} ${esc(b.time)} · ${b.duration} perc</div><div class="muted">${esc(b.description)}</div>${b.status==='Lezárásra vár'?`<div class="notice">A szerelő lezárta a munkát. Kérjük, erősítsd meg, hogy minden rendben van!</div><div class="actions"><button class="btn success" onclick="confirmTicket(${b.id},true)">Minden rendben</button><button class="btn danger" onclick="confirmTicket(${b.id},false)">Problémám van</button></div>`:''}</div><div class="actions">${badge(b.status)}${b.status==='Függőben'?`<button class="btn danger" onclick="cancelBooking(${b.id})">Lemondás</button>`:''}</div></div>`).join('')}
function addCar(e){e.preventDefault();let c=fieldValue('car');if(!c.origin||!c.brand||!c.model||!c.year||!c.fuel)return toast('Töltsd ki az autó kötelező adatait!');db.cars.push({id:Date.now(),owner:session.email,...c});persist();render();toast('Autó hozzáadva!')}
function removeCar(id){let c=db.cars.find(c=>c.id===id&&c.owner===session.email);if(!c)return;if(!confirm('Biztosan eltávolítod ezt az autót?'))return;db.cars=db.cars.filter(x=>x.id!==id);persist();render();toast('Autó eltávolítva.')}
function fillSavedCar(){let raw=document.getElementById('saved-car').value,id=Number(raw.split(' | ')[0]),c=db.cars.find(c=>c.id===id&&c.owner===session.email);if(!c)return;populateCar('booking',c)}
function updateDuration(){let v=document.getElementById('service').value;document.getElementById('duration-hint').textContent=v?`Várható időtartam: ${services[v]} perc`:'Válassz szolgáltatást'}
function addBooking(e){e.preventDefault();let c=fieldValue('booking'),type=document.getElementById('service').value,date=document.getElementById('date').value,time=document.getElementById('time').value,description=document.getElementById('description').value.trim();if(!c.origin||!c.brand||!c.model||!c.year||!c.fuel||!type||!date||!time)return toast('Minden kötelező mezőt tölts ki!');let start=new Date(`${date}T${time}`);if(!/^2026-\d{2}-\d{2}$/.test(date)||start.getFullYear()!==2026)return toast('2026-os dátumot válassz!');if(start<=new Date())return toast('Csak jövőbeli időpont választható.');let saved=db.cars.find(x=>x.owner===session.email&&x.origin===c.origin&&x.brand===c.brand&&x.model===c.model&&x.year===c.year&&x.fuel===c.fuel);let id=Math.max(1000,...db.bookings.map(b=>b.id))+1;db.bookings.push({id,owner:session.email,carId:saved?.id||null,car:carName(c),origin:c.origin,fuel:c.fuel,engine:c.engine,type,date,time,duration:services[type],description,status:'Függőben',mechanic:null});persist();page='bookings';render();toast('Foglalás rögzítve, elfogadásra vár!')}
function cancelBooking(id){let b=db.bookings.find(b=>b.id===id&&b.owner===session.email&&b.status==='Függőben');if(!b)return;b.status='Lemondva';persist();render()}
function confirmTicket(id,approved){let b=db.bookings.find(b=>b.id===id&&b.owner===session.email&&b.status==='Lezárásra vár');if(!b)return;if(approved){b.status='Resolved';b.resolvedAt=new Date().toISOString()}else{b.status='Reklamáció';b.complaintAt=new Date().toISOString()}persist();render();toast(approved?'Ticket véglegesen lezárva. Köszönjük!':'A reklamációt továbbítottuk a szerelőnek.')}
function activeTickets(){return db.bookings.filter(b=>!['Resolved','Lemondva'].includes(b.status))}
function mechanicView(){
 const active=activeTickets();
 const incoming=active.filter(b=>b.status==='Függőben');
 const jobs=active.filter(b=>['Elfogadva','Folyamatban','Alkatrészre vár','Reklamáció'].includes(b.status));
 const waiting=active.filter(b=>b.status==='Lezárásra vár');
 if(page==='detail')return ticketDetail();
 if(page==='overview')return header('Szerelői dashboard','Aktuális munkák és beérkező igények')+
 `<div class="grid"><div class="stat">Beérkező ticketek<strong>${incoming.length}</strong><button class="btn" onclick="goAdmin('incoming')">Megtekintés</button></div><div class="stat">Aktív munkák<strong>${jobs.length}</strong><button class="btn" onclick="goAdmin('active')">Megtekintés</button></div><div class="stat">Visszaigazolásra vár<strong>${waiting.length}</strong><button class="btn" onclick="goAdmin('waiting')">Megtekintés</button></div></div><section class="panel"><div class="toolbar"><h2>Legújabb beérkező ticketek</h2><button class="btn" onclick="goAdmin('incoming')">Mind megtekintése</button></div>${ticketItems(incoming.slice(-5).reverse())}</section>`;
 if(page==='incoming')return ticketListPage('Beérkező ticketek','Elfogadásra váró szervizigények',incoming);
 if(page==='active')return ticketListPage('Aktív munkák','Elfogadott, folyamatban lévő, alkatrészre váró és reklamált munkák',jobs);
 if(page==='waiting')return ticketListPage('Visszaigazolásra vár','A szerelő lezárta a munkát, az ügyfél válaszára várunk',waiting);
 if(page==='tickets')return ticketListPage('Összes aktív ticket','Még nem archivált munkák',active);
 if(page==='resolved'){let done=db.bookings.filter(b=>b.status==='Resolved');return header('Resolved ticketek','Ügyfél által jóváhagyott, archivált munkák')+`<section class="panel"><h2>Lezárt jegyek (${done.length})</h2>${ticketItems(done.slice().reverse())}</section>`}
 if(page==='calendar')return header('Időpontok','Aktuális foglalások listája')+`<section class="panel table-wrap"><table><thead><tr><th>Ticket</th><th>Dátum</th><th>Autó</th><th>Szolgáltatás</th><th>Állapot</th></tr></thead><tbody>${active.filter(b=>b.status!=='Lemondva').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(b=>`<tr><td><button class="link" onclick="openTicket(${b.id},'calendar')">#${b.id}</button></td><td>${esc(b.date)} ${esc(b.time)}</td><td>${esc(b.car)}</td><td>${esc(b.type)}</td><td>${badge(b.status)}</td></tr>`).join('')}</tbody></table></section>`;
 if(page==='stock')return header('Alkatrészkészlet','Raktárkészlet nyilvántartása')+`<section class="panel"><h2>Készlet</h2>${db.stock.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">Készlet: ${p.qty} ${esc(p.unit)}</div></div><div class="actions"><button class="btn" onclick="adjustStock(${p.id},-1)">−1</button><button class="btn" onclick="adjustStock(${p.id},1)">+1</button></div></div>`).join('')}</section>`;
 return '';
}
function goAdmin(destination){page=destination;selectedTicket=null;ticketSearch='';render()}
function openTicket(id,source){if(session?.role!=='mechanic')return;selectedTicket={id,source:source||page};page='detail';render()}
function backToTickets(){goAdmin(selectedTicket?.source||'incoming')}
function ticketListPage(title,subtitle,data){let term=ticketSearch.trim().toLocaleLowerCase('hu-HU');let filtered=data.filter(b=>[b.id,b.car,b.owner,b.type,b.date,b.status,b.description].some(v=>String(v??'').toLocaleLowerCase('hu-HU').includes(term)));return header(title,subtitle)+`<section class="panel"><div class="toolbar"><h2>Ticketek (${data.length})</h2><input class="ticket-search" aria-label="Ticket keresése" placeholder="Keresés: ticket, autó, ügyfél..." value="${esc(ticketSearch)}" oninput="filterTickets(this.value)"></div><div id="ticket-results">${ticketItems(filtered)}</div></section>`}
function filterTickets(value){ticketSearch=value;let data=page==='incoming'?activeTickets().filter(b=>b.status==='Függőben'):page==='active'?activeTickets().filter(b=>['Elfogadva','Folyamatban','Alkatrészre vár','Reklamáció'].includes(b.status)):page==='waiting'?activeTickets().filter(b=>b.status==='Lezárásra vár'):activeTickets();let term=value.trim().toLocaleLowerCase('hu-HU');document.getElementById('ticket-results').innerHTML=ticketItems(data.filter(b=>[b.id,b.car,b.owner,b.type,b.date,b.status,b.description].some(v=>String(v??'').toLocaleLowerCase('hu-HU').includes(term))))}
function ticketItems(data){if(!data.length)return '<p class="empty">Nincs megjeleníthető ticket.</p>';return data.slice().reverse().map(b=>`<div class="item"><div><b>#${b.id} · ${esc(b.car)}</b><div class="muted">${esc(b.type)} · ${esc(b.date)} ${esc(b.time)} · ${b.duration} perc</div><div class="muted">Ügyfél: ${esc(b.owner)}</div>${badge(b.status)}</div><button class="btn primary" onclick="openTicket(${b.id},'${page}')">Részletek megtekintése</button></div>`).join('')}
function ticketDetail(){let b=db.bookings.find(b=>b.id===selectedTicket?.id);if(!b)return header('A ticket nem található','')+`<button class="btn" onclick="goAdmin('incoming')">Vissza</button>`;let user=db.users.find(u=>u.email===b.owner);let car=db.cars.find(c=>c.id===b.carId);let actions='';
 if(b.status==='Függőben')actions=`<button class="btn primary" onclick="acceptTicket(${b.id})">Ticket elfogadása</button>`;
 if(b.status==='Elfogadva')actions=`<button class="btn" onclick="changeStatus(${b.id},'Függőben')">Leadás</button><button class="btn" onclick="changeStatus(${b.id},'Alkatrészre vár')">Alkatrészre vár</button><button class="btn primary" onclick="changeStatus(${b.id},'Folyamatban')">Munka indítása</button>`;
 if(b.status==='Folyamatban')actions=`<button class="btn" onclick="changeStatus(${b.id},'Alkatrészre vár')">Alkatrészre vár</button><button class="btn success" onclick="changeStatus(${b.id},'Lezárásra vár')">Jegy lezárása</button>`;
 if(b.status==='Alkatrészre vár')actions=`<button class="btn" onclick="changeStatus(${b.id},'Függőben')">Leadás</button><button class="btn primary" onclick="changeStatus(${b.id},'Folyamatban')">Munka folytatása</button>`;
 if(b.status==='Reklamáció')actions=`<button class="btn primary" onclick="changeStatus(${b.id},'Folyamatban')">Ticket újranyitása</button>`;
 return `<button class="btn" style="margin-bottom:18px" onclick="backToTickets()">← Vissza a listához</button>`+header(`Ticket #${b.id}`,'Részletes munkalap és állapotkezelés')+`<section class="panel"><div class="toolbar"><h2>${esc(b.car)}</h2>${badge(b.status)}</div><div class="detail-grid"><div class="detail-box"><div class="muted">Ügyfél neve</div><strong>${esc(user?.name||b.owner)}</strong></div><div class="detail-box"><div class="muted">Ügyfél e-mail címe</div><strong>${esc(b.owner)}</strong></div><div class="detail-box"><div class="muted">Jármű</div><strong>${esc(b.car)}</strong><div class="muted">Származás: ${esc(b.origin)}${car?' · '+esc(car.year):''}</div></div><div class="detail-box"><div class="muted">Szolgáltatás</div><strong>${esc(b.type)}</strong><div class="muted">Becsült idő: ${b.duration} perc</div></div><div class="detail-box"><div class="muted">Foglalás</div><strong>${esc(b.date)} · ${esc(b.time)}</strong></div><div class="detail-box"><div class="muted">Hozzárendelt szerelő</div><strong>${esc(b.mechanic||'Még nincs hozzárendelve')}</strong></div><div class="detail-box wide"><div class="muted">Hibaleírás / ügyfél megjegyzése</div><strong>${esc(b.description||'Nincs megadott hibaleírás.')}</strong></div></div>${b.status==='Lezárásra vár'?'<div class="notice">A ticket az ügyfél visszaigazolására vár.</div>':''}${b.status==='Reklamáció'?'<div class="notice">Az ügyfél problémát jelzett a javítással.</div>':''}<div class="detail-actions">${actions}</div></section>`}
function acceptTicket(id){if(session?.role!=='mechanic')return;let b=db.bookings.find(b=>b.id===id&&b.status==='Függőben');if(!b)return toast('A ticket már nem fogadható el.');if(!confirm(`Biztosan elfogadod a(z) #${id} ticketet?\n${b.car} – ${b.type}\n${b.date} ${b.time}`))return;changeStatus(id,'Elfogadva')}
const transitions={'Függőben':['Elfogadva'],'Elfogadva':['Függőben','Alkatrészre vár','Folyamatban'],'Folyamatban':['Alkatrészre vár','Lezárásra vár'],'Alkatrészre vár':['Függőben','Folyamatban'],'Reklamáció':['Folyamatban']};
function changeStatus(id,next){if(session?.role!=='mechanic')return;let b=db.bookings.find(b=>b.id===id);if(!b||!transitions[b.status]?.includes(next))return;b.status=next;b.mechanic=next==='Függőben'?null:session.email;if(next==='Lezárásra vár')b.closedAt=new Date().toISOString();persist();if(page==='detail'&&next==='Elfogadva'){selectedTicket.source='active'}render();toast(`#${id}: ${next}`)}
function adjustStock(id,delta){if(session?.role!=='mechanic')return;let p=db.stock.find(p=>p.id===id);if(!p||p.qty+delta<0)return;p.qty+=delta;persist();render()}
function render(){document.getElementById('app').innerHTML=session?layout():authView()}
render();
</script></body></html>
